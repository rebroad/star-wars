name: Build browser emulator

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install 3.1.35
          ./emsdk/emsdk activate 3.1.35
          echo "${{ runner.temp }}/emsdk" >> "$GITHUB_PATH"
          echo "EMSDK=${{ runner.temp }}/emsdk" >> "$GITHUB_ENV"

      - name: Build WebAssembly emulator
        env:
          MAME_SOURCE: ${{ runner.temp }}/mame
          MAME_REPOSITORY: https://github.com/rebroad/mame.git
          WEBASSEMBLY: "1"
          MAME_JOBS: "4"
        run: |
          source "$EMSDK/emsdk_env.sh"
          git clone --depth 1 "$MAME_REPOSITORY" "$MAME_SOURCE"
          set -o pipefail
          tools/build-browser.sh 2>&1 | tee "$RUNNER_TEMP/star-wars-browser-build.log"

      - name: Upload browser build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-wars-browser-build-log
          path: ${{ runner.temp }}/star-wars-browser-build.log
          if-no-files-found: ignore

      - name: Smoke-test static browser assets
        run: |
          python3 -m http.server 8000 --directory web >"$RUNNER_TEMP/star-wars-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null
          curl --fail --silent http://127.0.0.1:8000/starwars-web.js >/dev/null
          curl --fail --silent http://127.0.0.1:8000/starwars-web.wasm >/dev/null
          curl --fail --silent http://127.0.0.1:8000/roms/starwars.zip >/dev/null

      - name: Smoke-test emulator in a headless browser
        run: |
          npm install --no-save --ignore-scripts puppeteer@24.26.1
          PUPPETEER_CACHE_DIR="$RUNNER_TEMP/puppeteer" npx puppeteer browsers install chrome-headless-shell
          chrome_path=$(find "$RUNNER_TEMP/puppeteer" -type f -name chrome-headless-shell -perm -u+x | head -n 1)
          test -n "$chrome_path"
          python3 -m http.server 8000 --directory web >"$RUNNER_TEMP/star-wars-http-runtime.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          CHROME_PATH="$chrome_path" node <<'NODE'
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.CHROME_PATH,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            const errors = [];
            const failedRequests = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });
            page.on('requestfailed', request => {
              failedRequests.push(`${request.url()}: ${request.failure()?.errorText || 'unknown error'}`);
            });
            await page.goto('http://127.0.0.1:8000/', { waitUntil: 'load', timeout: 120000 });
            let waitError = null;
            try {
              await page.waitForFunction(() => (
                window.mameRuntimeReady === true ||
                window.mameStartupError ||
                (document.querySelector('#status')?.textContent || '').includes('Emulator error')
              ), { timeout: 30000 });
            } catch (error) {
              waitError = error.message;
            }
            await new Promise(resolve => setTimeout(resolve, 3000));
            const state = await page.evaluate(() => ({
              width: document.querySelector('#canvas')?.width,
              height: document.querySelector('#canvas')?.height,
              status: document.querySelector('#status')?.textContent,
              runtimeReady: window.mameRuntimeReady === true,
              startupError: window.mameStartupError || null,
              calledRun: window.Module?.calledRun === true
            }));
            await browser.close();
            if (waitError || errors.length || failedRequests.length || !state.runtimeReady || state.startupError || state.width <= 0 || state.height <= 0) {
              throw new Error(`Runtime smoke test failed: ${JSON.stringify({ waitError, errors, failedRequests, state })}`);
            }
            console.log(`Runtime smoke test passed: ${state.width}x${state.height}`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload emulator-only browser assets
        uses: actions/upload-artifact@v4
        with:
          name: star-wars-browser-emulator
          path: |
            web/index.html
            web/mame-loader.js
            web/README.md
            web/starwars-web.js
            web/starwars-web.wasm
